networks:
  media-net:
    name: media-net
    external: true   # create once on a Swarm manager with: docker network create -d overlay --attachable media-net

volumes:
  media_dir:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/media }
  jellyfin_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/jellyfin/config }
  jellyfin_cache:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/jellyfin/cache }
  jellyseerr_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/jellyseerr/config }
  radarr_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/radarr }
  sonarr_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/sonarr }
  prowlarr_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/prowlarr }
  qb_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/qbittorrent }
  ersatztv_config:
    driver: local
    driver_opts: { type: none, o: bind, device: /mnt/docker/ersatztv }

services:
  # ----------------------------------------------------------
  # VPN gateway for qBittorrent (Proton + OpenVPN)
  # ----------------------------------------------------------
  gluetun:
    # Stays on latest on purpose. That tag is the development edge, and the maintainer prefers users on it.
    # Pin v3 instead if you want the stable line.
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add: [ NET_ADMIN ]
    devices:
      - /dev/net/tun:/dev/net/tun
    env_file:
      - stack.env
    environment:
      # --- ProtonVPN OpenVPN Configuration ---
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=openvpn
      # OPENVPN_USER and OPENVPN_PASSWORD are loaded from stack.env
      # PORT_FORWARD_ONLY=off overrides gluetun's Proton default and can select servers without forwarding.
      # The README key variables section explains the forwarding setup.
      - PORT_FORWARD_ONLY=off
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # FIREWALL_VPN_INPUT_PORTS and SERVER_HOSTNAMES come from stack.env through env_file.
      # An interpolated entry here resolves empty under plain docker compose and overrides the file.
    volumes:
      - /lib/modules:/lib/modules:ro
      - qb_config:/gluetun
    # Publish ONLY the WebUI; all other qBittorrent traffic egresses via VPN
    ports:
      - "8080:8080/tcp"                     # qBittorrent WebUI through gluetun
    networks: [ media-net ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # qBittorrent (all traffic bound to gluetun)
  # ----------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.4
    container_name: qbittorrent
    # Bind to gluetun's network namespace so traffic is forced through the VPN
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    env_file:
      - stack.env
    environment:
      UMASK: "002"     # LSIO images read UMASK
      WEBUI_PORT: "8080"
    volumes:
      - qb_config:/config
      - media_dir:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Prowlarr
  # ----------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    env_file:
      - stack.env
    volumes:
      - prowlarr_config:/config
      - media_dir:/data
    networks: [ media-net ]
    ports:
      - "9696:9696"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # FlareSolverr (Cloudflare challenge solver for Prowlarr)
  # Prowlarr reaches it at http://flaresolverr:8191 and both must share the same
  # egress IP, so if Prowlarr ever moves behind gluetun this service must move too.
  # ----------------------------------------------------------
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    # No env_file on purpose. FlareSolverr runs a browser against untrusted sites,
    # so it does not receive stack.env. TZ sets the timezone for its logs and its browser.
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=Etc/UTC
    networks: [ media-net ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Radarr
  # ----------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    env_file:
      - stack.env
    volumes:
      - radarr_config:/config
      - media_dir:/data
    networks: [ media-net ]
    ports:
      - "7878:7878"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7878/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Sonarr
  # ----------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    env_file:
      - stack.env
    volumes:
      - sonarr_config:/config
      - media_dir:/data
    networks: [ media-net ]
    ports:
      - "8989:8989"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8989/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Jellyseerr
  # ----------------------------------------------------------
  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3
    container_name: jellyseerr
    env_file:
      - stack.env
    environment:
      - LOG_LEVEL=info
    user: "1000:1000"
    volumes:
      - jellyseerr_config:/app/config
    networks: [ media-net ]
    ports:
      - "5055:5055"
    restart: unless-stopped
    healthcheck:
      # The image has wget but not curl.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ----------------------------------------------------------
  # Jellyfin
  # Note: i7-8700K (pvebitchin) has no iGPU — hardware acceleration
  # removed. Software/CPU transcoding only. Revisit if a discrete
  # GPU is added to the Z370-A board.
  # ----------------------------------------------------------
  jellyfin:
    # 12.x is a one-way upgrade from 10.11, and this tag is that upgrade for an existing install.
    # Read the README Jellyfin 12 upgrade section before starting it.
    image: jellyfin/jellyfin:12.2
    container_name: jellyfin
    env_file:
      - stack.env
    user: "1000:1000"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - media_dir:/media
    networks: [ media-net ]
    ports:
      - "8096:8096"
      - "7359:7359/udp"
      - "8920:8920"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ----------------------------------------------------------
  # ErsatzTV Legacy (24/7 channels for Jellyfin Live TV)
  # The project is in maintenance as ErsatzTV Legacy, with no new features, while bug and security fixes continue.
  # Pin the tag and back up /mnt/docker/ersatztv before changing it, because downgrades are unsupported.
  # ----------------------------------------------------------
  ersatztv:
    image: ersatztv/legacy:v26.11.1
    container_name: ersatztv
    # No env_file on purpose. stack.env carries the VPN credentials and ErsatzTV does not need them.
    environment:
      # Edit this value by hand to match TZ in stack.env so guide times line up. This service has no env_file, so stack.env does not supply it.
      - TZ=Etc/UTC
      # The image creates /transcode at the filesystem root by default, which a non-root user cannot do,
      # so transcode scratch goes under the config bind.
      - ETV_TRANSCODE_FOLDER=/config/transcode
    # /mnt/docker/ersatztv must be owned by 1000:1000.
    user: "1000:1000"
    volumes:
      - ersatztv_config:/config
      # No media mount. ErsatzTV streams the files through the Jellyfin API.
    networks: [ media-net ]
    ports:
      # The UI has no login, so keep it LAN-only and off NPM.
      - "8409:8409"
    restart: unless-stopped
    healthcheck:
      # The probe hits the unauthenticated playlist URL because /api routes need an API key since v26.8.1.
      # If OIDC is enabled, confirm /iptv/channels.m3u still answers without a login or the container goes unhealthy.
      test: ["CMD", "curl", "-sf", "http://localhost:8409/iptv/channels.m3u"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
